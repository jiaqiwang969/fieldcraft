name: Harmonic Linux verification

# The fork's existing CI uses sponsored runners and targets develop. This scoped
# check runs only on the user's task branch; it never publishes or blesses data.
on:
  push:
    branches: [feat/harmonic]
    paths:
      - '.github/workflows/harmonic-linux.yml'
      - 'crates/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: harmonic-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'jiaqiwang969/fieldcraft'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_CI_DEBUG: '0'
      CARGO_BUILD_JOBS: '6'
      CARGO_TERM_COLOR: never
      FIELDCRAFT_GPU: cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bounded native Linux checks
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/harmonic-target
          EVIDENCE: ${{ runner.temp }}/harmonic-evidence
        run: |
          mkdir -p "$EVIDENCE"
          {
            date -u +%FT%TZ
            git rev-parse HEAD
            uname -a
            cat /etc/os-release
            free -b
            df -B1 . "$RUNNER_TEMP"
          } > "$EVIDENCE/environment.txt"
          cat > "$RUNNER_TEMP/harmonic-checks.sh" <<'CHECKS'
          #!/usr/bin/env bash
          set -eu -o pipefail
          rustup toolchain install 1.99.1 --profile minimal
          rustup run 1.99.1 rustc -Vv
          status=0
          check() {
            local label="$1"
            shift
            local started="$SECONDS"
            local rc=0
            "$@" > "$EVIDENCE/$label.log" 2>&1 || rc=$?
            cat "$EVIDENCE/$label.log"
            printf '%s\t%s\t%s\n' "$label" "$rc" "$((SECONDS-started))" >> "$EVIDENCE/checks.tsv"
            if [ "$rc" -ne 0 ]; then status=1; fi
          }
          cargo1() { rustup run 1.99.1 cargo "$@"; }
          check core cargo1 test --locked --profile ci -j 6 -p fieldcraft-mesh -p fieldcraft-solver -p fieldcraft-testkit --lib
          check engine-fillet cargo1 test --locked --profile ci -j 6 -p fieldcraft-engine --lib cmd::mesh::boundary_on_the_geometry::refinement_below_the_facets_keeps_a_fillets_nodes_on_its_torus -- --exact --ignored --nocapture
          check corpus cargo1 test --locked --profile ci -j 6 -p fieldcraft-testkit --lib runner::tests::corpus_matches_its_fixtures -- --exact --ignored --nocapture
          check bracket cargo1 test --locked --profile ci -j 6 -p fieldcraft-testkit --test bracket_blocks -- --ignored
          # Known experimental failures stay visible in the oracle output and
          # expected.json; a zero oracle exit does not validate those amplitudes.
          check harmonic-oracle cargo1 run --locked --profile ci -j 6 -p fieldcraft-testkit --bin oracle -- --case harmonic-sdof --case harmonic-cantilever --case harmonic-reciprocity --case harmonic-nafems-5h --case harmonic-tip-mass-experiment --no-write
          git diff --stat > "$EVIDENCE/generated-diff.txt"
          exit "$status"
          CHECKS
          # This first hosted check is deliberately bounded below the local
          # heavy-task thresholds. Record a resource stop as incomplete, never
          # as a passing test. All children inherit this new process group.
          started=$SECONDS
          peak_kib=0
          stop_reason=none
          setsid bash "$RUNNER_TEMP/harmonic-checks.sh" > "$EVIDENCE/console.log" 2>&1 &
          task_pid=$!
          while kill -0 "$task_pid" 2>/dev/null; do
            rss_kib=$(ps -eo pgid=,rss= | awk -v p="$task_pid" '$1 == p {s += $2} END {printf "%.0f", s}')
            if [ "$rss_kib" -gt "$peak_kib" ]; then peak_kib=$rss_kib; fi
            free_bytes=$(df -B1 --output=avail "$RUNNER_TEMP" | tail -1 | tr -d ' ')
            if [ "$rss_kib" -gt 7340032 ]; then stop_reason=rss_7_GiB; fi
            if [ "$((SECONDS-started))" -ge 540 ]; then stop_reason=wall_540_s; fi
            if [ "$free_bytes" -lt 1000000000 ]; then stop_reason=hosted_disk_1_GB; fi
            if [ "$stop_reason" != none ]; then
              kill -TERM -- "-$task_pid" 2>/dev/null || true
              sleep 2
              kill -KILL -- "-$task_pid" 2>/dev/null || true
              break
            fi
            sleep 2
          done
          rc=0
          wait "$task_pid" || rc=$?
          if [ "$stop_reason" != none ]; then rc=124; fi
          printf '{"exit_code":%s,"execution_seconds":%s,"sampled_peak_group_rss_kib":%s,"stop_reason":"%s"}\n' "$rc" "$((SECONDS-started))" "$peak_kib" "$stop_reason" > "$EVIDENCE/resources.json"
          cat "$EVIDENCE/environment.txt" "$EVIDENCE/console.log" "$EVIDENCE/resources.json"
          exit "$rc"
      - name: Retain small logs and resource receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harmonic-linux-${{ github.sha }}
          path: ${{ runner.temp }}/harmonic-evidence
          if-no-files-found: error
          retention-days: 14
